<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5cab"><title>PGVCL Bill Finder</title><style>body{margin:0;background:#f2f6fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#17202a}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 5px 22px #0001;margin-top:25px}h1{margin:0 0 6px}.muted{color:#64748b}.label{font-weight:700;margin-top:22px;display:block}input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;font-size:18px;margin-top:8px}input{border:1px solid #cbd5e1}button{border:0;background:#0b5cab;color:white;font-weight:800}.status{margin-top:15px;padding:14px;border-radius:13px;background:#f1f5f9}.ok{background:#ecfdf5}.err{background:#fef2f2}.btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:13px;margin-top:10px;background:#14833b;color:#fff;font-weight:800}.small{font-size:13px;color:#64748b;margin-top:18px}</style></head><body><div class="wrap"><div class="card"><h1>PGVCL Bill Finder</h1><div class="muted">View your latest electricity bill.</div><label class="label">Consumer Number</label><input id="c" inputmode="numeric" autocomplete="off" placeholder="Enter Consumer Number"><button id="b">View My Bill</button><div id="s" class="status">Enter your Consumer Number.</div><div id="r"></div><div class="small">Only your Consumer Number is required. The master PDF is managed by the office.</div></div></div><script>const c=document.getElementById('c'),b=document.getElementById('b'),s=document.getElementById('s'),r=document.getElementById('r');c.oninput=()=>c.value=c.value.replace(/\D/g,'');b.onclick=async()=>{const n=c.value;if(n.length<6){s.className='status err';s.textContent='Please enter a valid Consumer Number.';r.innerHTML='';return}b.disabled=true;s.className='status';s.textContent='Searching…';r.innerHTML='';try{const x=await fetch('/api/bill?consumer='+encodeURIComponent(n));const d=await x.json();if(!x.ok)throw Error(d.error);s.className='status ok';s.innerHTML='<b>Bill found ✓</b><br>Consumer No.: '+d.consumer_no+'<br>Bill Month: '+d.bill_month+(d.name?'<br>Name: '+d.name:'');r.innerHTML='<a class="btn" href="'+d.pdf_url+'" target="_blank">View Bill PDF</a><a class="btn" href="'+d.pdf_url+'" download="'+d.consumer_no+'_Bill.pdf">Download Bill PDF</a>'}catch(e){s.className='status err';s.textContent=e.message}finally{b.disabled=false}}</script></body></html>
