<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PGVCL Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .card {
      max-width: 620px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    .subtitle {
      font-size: 19px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 18px;
      margin: 18px 0 8px;
    }

    input[type="password"],
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 16px;
      border: 2px solid #222;
      border-radius: 14px;
      font-size: 18px;
      background: white;
    }

    input[type="file"] {
      border: none;
      padding-left: 0;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 24px;
      border: none;
      border-radius: 14px;
      background: #1268b3;
      color: white;
      font-size: 21px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .status {
      margin-top: 24px;
      padding: 18px;
      border-radius: 14px;
      background: #eef6ff;
      font-size: 18px;
      line-height: 1.5;
    }

    .error {
      background: #fff0f0;
      color: #9b1c1c;
    }

    .success {
      background: #ecfdf3;
      color: #126b3a;
    }

    .progress-wrap {
      margin-top: 20px;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 24px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #1268b3;
      transition: width 0.3s;
    }

    .progress-text {
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .small {
      margin-top: 10px;
      color: #475569;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>PGVCL Admin</h1>

  <div class="subtitle">
    Upload the monthly master PDF received from corporate office.
  </div>

  <label for="password">
    Admin password
  </label>

  <input
    id="password"
    type="password"
    autocomplete="off"
    placeholder="Enter admin password"
  >

  <label for="month">
    Bill month (YYYY-MM)
  </label>

  <input
    id="month"
    type="text"
    value=""
    placeholder="Example: 2026-09"
  >

  <label for="pdf">
    Master PDF
  </label>

  <input
    id="pdf"
    type="file"
    accept="application/pdf,.pdf"
  >

  <button
    id="processButton"
    onclick="startProcessing()"
  >
    Process Monthly PDF
  </button>

  <div
    id="progressWrap"
    class="progress-wrap"
  >

    <div class="progress-bar">
      <div
        id="progressFill"
        class="progress-fill"
      ></div>
    </div>

    <div
      id="progressText"
      class="progress-text"
    >
      Starting...
    </div>

    <div
      id="progressDetails"
      class="small"
    ></div>

  </div>

  <div
    id="status"
    class="status"
    style="display:none;"
  ></div>

</div>

<script>

let pollingTimer = null;

function showStatus(
  message,
  type = ""
) {

  const box =
    document.getElementById("status");

  box.style.display = "block";

  box.className =
    "status " + type;

  box.textContent =
    message;
}


async function startProcessing() {

  const password =
    document
      .getElementById("password")
      .value
      .trim();

  const month =
    document
      .getElementById("month")
      .value
      .trim();

  const pdfInput =
    document
      .getElementById("pdf");

  const button =
    document
      .getElementById("processButton");


  if (!password) {

    showStatus(
      "Please enter the admin password.",
      "error"
    );

    return;
  }


  if (!/^\d{4}-\d{2}$/.test(month)) {

    showStatus(
      "Please enter the bill month as YYYY-MM.",
      "error"
    );

    return;
  }


  if (
    !pdfInput.files ||
    !pdfInput.files[0]
  ) {

    showStatus(
      "Please select the master PDF.",
      "error"
    );

    return;
  }


  const file =
    pdfInput.files[0];


  button.disabled = true;

  button.textContent =
    "Starting...";


  document
    .getElementById("progressWrap")
    .style.display = "block";


  showStatus(
    "Uploading the master PDF and starting background processing..."
  );


  try {

    const form =
      new FormData();

    form.append(
      "month",
      month
    );

    form.append(
      "pdf",
      file
    );


    const response =
      await fetch(
        "/api/admin/upload",
        {
          method: "POST",

          headers: {
            "x-admin-password":
              password
          },

          body: form
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to start processing."
      );
    }


    showStatus(
      "Processing has started. You can keep this page open to watch the progress."
    );


    pollProgress(
      data.jobId,
      password
    );


  } catch (error) {

    button.disabled = false;

    button.textContent =
      "Process Monthly PDF";


    showStatus(
      error.message ||
      "Failed to start processing.",
      "error"
    );
  }
}


function pollProgress(
  jobId,
  password
) {

  if (pollingTimer) {

    clearTimeout(
      pollingTimer
    );
  }


  checkProgress(
    jobId,
    password
  );
}


async function checkProgress(
  jobId,
  password
) {

  try {

    const response =
      await fetch(
        "/api/admin/progress/" +
        encodeURIComponent(jobId),
        {
          headers: {
            "x-admin-password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to read processing progress."
      );
    }


    const job =
      data.job;


    const total =
      Number(job.pageCount || 0);

    const current =
      Number(job.currentPage || 0);

    const processed =
      Number(job.processed || 0);

    const skipped =
      Number(job.skipped || 0);

    const failed =
      Number(job.failedPages || 0);


    let percent = 0;

    if (total > 0) {

      percent =
        Math.min(
          100,
          Math.round(
            (current / total) * 100
          )
        );
    }


    document
      .getElementById("progressFill")
      .style.width =
      percent + "%";


    document
      .getElementById("progressText")
      .textContent =
      `${current} / ${total} pages — ${percent}%`;


    document
      .getElementById("progressDetails")
      .textContent =
      `${processed} bills saved • ${skipped} pages skipped • ${failed} pages failed`;


    if (job.status === "done") {

      document
        .getElementById("progressFill")
        .style.width = "100%";


      document
        .getElementById("progressText")
        .textContent =
        `Completed — ${processed} bills processed`;


      showStatus(
        job.message ||
        "Monthly PDF processing completed.",
        "success"
      );


      const button =
        document
          .getElementById("processButton");

      button.disabled = false;

      button.textContent =
        "Process Another Monthly PDF";


      return;
    }


    if (job.status === "failed") {

      showStatus(
        job.error ||
        job.message ||
        "Processing failed.",
        "error"
      );


      const button =
        document
          .getElementById("processButton");

      button.disabled = false;

      button.textContent =
        "Try Again";


      return;
    }


    showStatus(
      job.message ||
      "Processing..."
    );


    pollingTimer =
      setTimeout(
        () =>
          checkProgress(
            jobId,
            password
          ),
        2000
      );


  } catch (error) {

    showStatus(
      error.message ||
      "Unable to check processing progress.",
      "error"
    );


    const button =
      document
        .getElementById("processButton");

    button.disabled = false;

    button.textContent =
      "Try Again";
  }
}

</script>

</body>
</html>
