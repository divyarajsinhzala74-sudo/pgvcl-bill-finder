<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PGVCL Admin</title><style>body{margin:0;background:#f2f6fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#17202a}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:22px;margin-top:20px;box-shadow:0 5px 22px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font-size:17px;margin-top:8px}button{border:0;background:#0b5cab;color:#fff;font-weight:800}.status{padding:14px;border-radius:12px;background:#f1f5f9;margin-top:15px}.ok{background:#ecfdf5}.err{background:#fef2f2}</style></head><body><div class="wrap"><div class="card"><h1>PGVCL Admin</h1><p>Upload the monthly master PDF received from corporate office.</p><label>Admin password</label><input id="pw" type="password"><label>Bill month (YYYY-MM)</label><input id="mo" placeholder="2026-10"><label>Master PDF</label><input id="pdf" type="file" accept="application/pdf,.pdf"><button id="up">Process Monthly PDF</button><div id="s" class="status">Ready.</div></div></div><script>const $=id=>document.getElementById(id);$('up').onclick=async()=>{const f=$('pdf').files[0],pw=$('pw').value,mo=$('mo').value.trim();if(!f||!pw||!/^[0-9]{4}-[0-9]{2}$/.test(mo)){ $('s').className='status err';$('s').textContent='Enter password, month and PDF.';return}$('up').disabled=true;$('s').textContent='Uploading and processing… Keep this page open.';const fd=new FormData();fd.append('pdf',f);fd.append('month',mo);try{const x=await fetch('/api/admin/upload',{method:'POST',headers:{'x-admin-password':pw},body:fd});const d=await x.json();if(!x.ok)throw Error(d.error);$('s').className='status ok';$('s').innerHTML='<b>Monthly PDF processed ✓</b><br>Pages scanned: '+d.pages+'<br>Bills indexed: '+d.found+'<br>Month: '+d.bill_month}catch(e){$('s').className='status err';$('s').textContent=e.message}finally{$('up').disabled=false}}</script></body></html>
